<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOSE CALCULATOR - OUTPUT</title>
<style>
* { box-sizing:border-box; }

body {
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg,
        rgba(118,194,222,.25) 0%,
        rgba(83,156,183,.40) 25%,
        rgba(170,211,226,.50) 50%,
        rgba(63,123,145,.75) 75%,
        rgba(29,68,82,1) 100%);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;
    justify-content:center;
    padding:24px 10px;
}

.app { width:100%; max-width:360px; }

.title {
    width:100%; min-height:64px; margin-bottom:20px;
    border:2px solid #000; border-radius:8px;
    background:#2E7DA4; color:#000;
    font-size:24px; font-weight:800;
}

.output-card {
    width:100%;
    padding:20px 18px;
    background:#F3FBFF;
    border:1px solid #000;
    border-radius:20px;
    box-shadow:4px 5px 6px 2px rgba(106,118,123,1);
}

.result-row {
    display:grid;
    grid-template-columns:120px 1fr;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid #cbd7dc;
    align-items:start;
}

.result-row:last-child { border-bottom:none; }
.result-label { font-weight:800; }
.result-value { overflow-wrap:anywhere; }

.safety {
    margin-top:14px;
    padding:12px;
    border-radius:7px;
    background:#fff4f4;
    border:1px solid rgba(184,71,71,.45);
}

.safety-title {
    margin:0 0 6px;
    color:#b84747;
    font-weight:800;
}

.notes-list,
.reference-list {
    margin:6px 0 0 18px;
    padding:0;
}

.notes-list li,
.reference-list li { margin:5px 0; }

.reference {
    margin-top:14px;
    font-size:12px;
    color:#555;
}

.reference-list a {
    color:#245f86;
    overflow-wrap:anywhere;
}

.actions {
    display:flex;
    justify-content:center;
    margin-top:20px;
}

.back {
    min-width:120px;
    height:40px;
    border:0;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(180deg,#5FA8DA 0%,#255F86 45%,#0B334E 100%);
    color:#000;
}

.empty {
    padding:20px;
    text-align:center;
    background:#F3FBFF;
    border:1px solid #000;
    border-radius:20px;
    box-shadow:4px 5px 6px 2px rgba(106,118,123,1);
}

/* ---------- Responsive layout ---------- */
html {
    width: 100%;
    overflow-x: hidden;
}

body {
    width: 100%;
    min-width: 0;
    min-height: 100dvh;
    padding:
        clamp(12px, 3vw, 32px)
        clamp(10px, 3vw, 32px)
        calc(clamp(12px, 3vw, 32px) + env(safe-area-inset-bottom));
}

.app {
    width: min(100%, 720px);
    max-width: 720px;
    margin: 0 auto;
}

.title {
    width: 100%;
    min-height: clamp(52px, 8vw, 68px);
    margin-bottom: clamp(14px, 2.5vw, 22px);
    padding: 8px 12px;
    font-size: clamp(20px, 3vw, 28px);
}

.output-card {
    width: 100%;
    padding: clamp(15px, 3vw, 26px);
    border-radius: clamp(14px, 3vw, 20px);
}

.result-row {
    grid-template-columns: minmax(110px, 0.32fr) minmax(0, 0.68fr);
    gap: clamp(8px, 2vw, 16px);
    padding: clamp(9px, 2vw, 13px) 0;
}

.result-label,
.result-value {
    overflow-wrap: anywhere;
    word-break: break-word;
}

.result-label {
    font-size: clamp(14px, 2vw, 16px);
}

.result-value {
    font-size: clamp(14px, 2vw, 16px);
}

.safety {
    margin-top: clamp(12px, 2vw, 16px);
    padding: clamp(10px, 2vw, 14px);
}

.reference {
    margin-top: clamp(10px, 2vw, 14px);
    overflow-wrap: anywhere;
}

.reference-list a {
    overflow-wrap: anywhere;
    word-break: break-word;
}

.actions {
    margin-top: clamp(16px, 3vw, 22px);
}

.back {
    min-width: 120px;
    min-height: 42px;
    height: auto;
    padding: 8px 14px;
}

@media (max-width: 480px) {
    .result-row {
        grid-template-columns: 1fr;
        gap: 4px;
    }

    .result-label {
        margin-bottom: 1px;
    }
}

</style>
</head>

<body>
<main class="app">
    <button class="title" type="button">DOSE-CALCULATOR</button>

    <section id="output"></section>

    <div class="actions">
        <button class="back" type="button" onclick="window.location.href='input_rev01_weightbased.html'">
            Back to Calculator
        </button>
    </div>
</main>

<script>
function getResult() {
    const stored = localStorage.getItem("doseCalculatorResult");
    if (!stored) return null;

    try {
        return JSON.parse(stored);
    } catch (error) {
        console.error("Could not read calculation result:", error);
        return null;
    }
}

function formatNumber(value) {
    const number = Number(value);
    if (!Number.isFinite(number)) return value || "NA";
    return Number.isInteger(number)
        ? String(number)
        : String(Number(number.toFixed(2)));
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function row(label, value) {
    if (value === "" || value === null || value === undefined) return "";
    return `
        <div class="result-row">
            <div class="result-label">${escapeHtml(label)}</div>
            <div class="result-value">${escapeHtml(value)}</div>
        </div>
    `;
}

function renderNotes(notes) {
    if (Array.isArray(notes)) {
        const items = notes.filter(Boolean);
        if (!items.length) return "<div>NA</div>";
        return `<ul class="notes-list">${items.map(note =>
            `<li>${escapeHtml(note)}</li>`
        ).join("")}</ul>`;
    }

    if (!notes || notes === "NA") return "<div>NA</div>";

    const items = String(notes)
        .split(/\n+/)
        .map(item => item.trim())
        .filter(Boolean);

    return `<ul class="notes-list">${items.map(note =>
        `<li>${escapeHtml(note)}</li>`
    ).join("")}</ul>`;
}

function renderReference(reference) {
    if (!reference) return "NA";

    if (typeof reference === "string") {
        return escapeHtml(reference);
    }

    const source = reference.source || "NA";
    const edition = reference.edition ? `, ${reference.edition}` : "";
    const author = reference.author ? ` — ${reference.author}` : "";

    let html = `<div>${escapeHtml(source + edition + author)}</div>`;

    const urls = Array.isArray(reference.urls)
        ? reference.urls
        : reference.url
            ? [reference.url]
            : [];

    if (urls.length) {
        html += `<ul class="reference-list">`;
        urls.forEach(url => {
            const safeUrl = escapeHtml(url);
            html += `<li><a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a></li>`;
        });
        html += `</ul>`;
    }

    return html;
}

function renderOutput() {
    const output = document.getElementById("output");
    const data = getResult();

    if (!data) {
        output.innerHTML = `
            <div class="empty">
                No calculation found.<br><br>
                Please go back and calculate a dose first.
            </div>
        `;
        return;
    }

    const isLiquid = [
        "Syrup",
        "Suspension",
        "Powd. for Suspension"
    ].includes(data.dosageForm);

    const doseDisplay = isLiquid && data.dailyDoseMl != null
        ? `${formatNumber(data.dailyDoseMl)} mL/day`
        : `${formatNumber(data.dailyDoseMg)} mg/day`;

    output.innerHTML = `
        <section class="output-card">
            ${row("Drug", data.drug)}
            ${row("Indication", data.indication)}
            ${row("Dose", doseDisplay)}
            ${row("Frequency", data.frequency)}
            ${row("Max. Dose", data.maxDose)}

            <div class="safety">
                <p class="safety-title">Additional Notes</p>
                ${renderNotes(data.additionalNote)}
            </div>

            <div class="reference">
                <strong>References:</strong>
                ${renderReference(data.reference)}
            </div>
        </section>
    `;
}

renderOutput();
</script>
</body>
</html>
