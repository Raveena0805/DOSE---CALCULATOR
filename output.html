<!DOCTYPE html>
<html>
    <head>
        <title>DOSE_CALCULATOR_OUTPUT</title>
        <style>
            body {
    background: linear-gradient(
        180deg,
        rgba(118, 194, 222, 0.25) 0%,
    rgba(83, 156, 183, 0.40) 25%,
    rgba(170, 211, 226, 0.5) 50%,
    rgba(63, 123, 145, 0.75) 75%,
    rgba(29, 68, 82, 1) 100%
    );
    background-repeat: no-repeat;
    background-attachment: fixed;
    justify-content: center;
    align-items: center;
    justify-content: center;
    width: 360px;
    height: 950px;  
}
.Entire-Page {
    margin-left: 50px;
    margin-bottom: 50px;
}
.Button-dose-calculator {
        background-color: #2E7DA4;
        color: black;
        height: 70px;
        width: 270;
        padding: 6px;
        font-weight: bolder;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-size: 24px;
        border-width: 2px;
        border-color: black;
        border-radius: 5px;
        border-style: solid;
        display: block;
        margin-bottom: 50px;  
        margin-top: 50px;
        cursor: pointer;
        align-items: center;
        margin-left: 20px;
 }
 .Output-Card {
    background-color: #F3FBFF;
    width: 300px;
    height: 300px;
    border-radius: 23px;
    border-color: black;
    border-width: 1px;
    box-shadow: 4px 5px 6px 2px rgba(106, 118, 123, 1);
    margin-bottom: 10px;

 }

 .drug_dose {
    display: grid;
        grid-template-columns: repeat(2, 1fr );
        column-gap: 0px;
        row-gap: 0px;
        grid-auto-rows: minmax(15px, auto);
        position: absolute;
    margin-top: 25px;
    margin-left: 10px;
    width: 280px;
    align-self: self-start;
 }

 .Dose {
    background-color: none;
    width: 80px;
    height: 31px;
    display: block;
    margin-top: 1px;
    margin-bottom: 1px;
    margin-left: 5px;
    margin-right: 5px;
    align-self: self-start;
 }
 .dose_title {
    background-color: none;
    width: 80px;
    height: 31px;
    display: block;
    margin-top: 1px;
    margin-bottom: 1px;
    margin-left: 5px;
    margin-right: 5px;
    align-self: self-start;

 }
 .dose_value {
    background-color: none;
    width: 80px;
    height: 31px;
    display: block;
    margin-top: 4px;
    margin-bottom: 1px;
    margin-left: 5px;
    margin-right: 5px;
    align-self: self-start;
 }


 .drug_frequency {
    display: grid;
    grid-template-columns: repeat(2, 1fr );
    column-gap: 0px;
    row-gap: 0px;
    grid-auto-rows: minmax(15px, auto);
    position: absolute;
    margin-top: 50px;
    margin-left: 15px;
    width: 280px;
    align-self: self-start;
 }

 .frequency {
    background-color: none;
    width: 80px;
    height: 31px;
    display: block;
    margin-top: 15px;
    margin-bottom: 15px;
    margin-left: 5px;
    margin-right: 5px;
    align-self: self-start;
 }

 .frequency_title {
    background-color: none;
    width: 80px;
    height: 31px;
    display: block;
    margin-top: 15px;
    margin-bottom: 15px;
    margin-left: 2px;
    margin-right: 5px;
    align-self: self-start;

 }
 .frequency_value {
    background-color: none;
    width: 80px;
    height: 31px;
    display: block;
    margin-top: 35px;
    margin-bottom: 15px;
    margin-left: 1px;
    margin-right: 5px;
    align-self: self-start;

 }

 .drug_max_dose {
    display: grid;
    grid-template-columns: repeat(2, 1fr );
    column-gap: 0px;
    row-gap: 0px;
    grid-auto-rows: minmax(15px, auto);
    position: absolute;
    margin-top: 100px;
    margin-left: 15px;
    width: 280px;
    align-self: self-start;
 }

 .max_dose {
    background-color: none;
    width: 80px;
    height: 31px;
    display: block;
    margin-top: 20px;
    margin-bottom: 15px;
    margin-left: 5px;
    margin-right: 5px;
    align-self: self-start;
 }

 .max_dose_title {
     background-color: none;
    width: 80px;
    height: 35px;
    display: block;
    margin-top: 15px;
    margin-bottom: 15px;
    margin-left: 2px;
    margin-right: 5px;
    align-self: self-start;
 }

 .max_dose_value {
    background-color: none;
    height: 31px;
    display: block;
    margin-top: 35px;
    margin-bottom: 15px;
    margin-left: 1px;
    margin-right: 5px;
    align-self: self-start;

 }

 .drug_additional_Note {
   display: grid;
        grid-template-columns: repeat(2, 1fr );
        column-gap: 0px;
        row-gap: 0px;
        grid-auto-rows: minmax(15px, auto);
        position: absolute;
    margin-top: 150px;
    margin-left: 15px;
    width: 280px;
    align-self: self-start; 
 }

 .additional_Note_title {
    background-color: none;
    color: red;
    height: 35px;
    display: block;
    margin-top: 50px;
    margin-bottom: 15px;
    margin-left: 5px;
    margin-right: 5px;
    align-self: self-start;
 }
 .additional_note {
    background-color: none;
    color: rgba(184, 71, 71, 0.845);
    height: 31px;
    display: block;
    margin-top: 50px;
    margin-bottom: 15px;
    margin-left: 1px;
    margin-right: 5px;
    align-self: self-start;
 }

 .Back_to_home {
    height: 30px;
    color: black;
    font-weight: bold;
    background: linear-gradient(180deg, 
   rgba(95, 168, 218, 1) 0%,
   rgb(37, 95, 134) 45%,
   rgb(11, 51, 78) 100%);
    border-radius: 5px;
    margin-top: 320px;
    align-items: center;
margin-left: 100px;}
 }

        </style>
    </head>
    <body>
        <div class="Entire-Page">
            <button class="Button-dose-calculator"> DOSE- CALCULATOR </button>

            <div class = Output-Card>

                <div class="drug_dose">
                <div class = Dose>
                    <button id = "dose_title" class= dose_title>Dose: </button>
                </div>
                <div id = "dose" class="dose_value"></div>
                </div>

                <div class="drug_frequency">
                <div class="frequency">
                    <button id="frequency_title" class="frequency_title">Frequency: 
                    </button>
                </div>
                <div id = "frequency" class="frequency_value"></div>
                </div>

               <div class="drug_max_dose">
                <div class="max_dose">
                    <button id="max_dose_title" class = "max_dose_title">Max. Daily Dose: </button>
                </div>
                <div id = "max_dose" class="max_dose_value"></div>
               </div>
                
                <div class="drug_additional_Note">
                    <p id="additional_Note_title" class="additional_Note_title"> Safety Instructions: </p>
                    <div id="additional_note" class="additional_note">
                    </div>
                </div>

                

            <button class="Back_to_home" onclick="window.location.href= 'index.html'"> Back to Home </button>

           <div id="result"></div>
        </div>
        <h1 id="result"></h1>

        

            <script>
              window.onload = function () {
  document.getElementById("result").innerText =
    localStorage.getItem("test");
};

            let drug = localStorage.getItem("drug");
            let dose = localStorage.getItem("dose");
            let weight = localStorage.getItem("weight");
            let dailydose = localStorage.getItem("daily_dose");
            let frequency = localStorage.getItem("frequency");
            let max_dose = localStorage.getItem("max_dose");
            let additional_Note = localStorage.getItem("additional_Note");

            window.onload = function() {
                document.getElementById("dose").innerText = `${dailydose} mg`;
                document.getElementById("frequency").innerText = frequency;
                document.getElementById("max_dose").innerText = `${max_dose}`;
                document.getElementById("additional_note").innerText = additional_Note;

                //document.getElementById("result").innerText = `OUTPUT: 
           // Dose: ${dailydose} mg, Frequency: ${frequency},
            // Max Dose: ${max_dose}, Additional Note: ${additional_Note}
           // `;
            };
            console.log(localStorage.getItem("drug"));
            console.log("ALL STORAGE:", localStorage);
            console.log("drug:", localStorage.getItem("drug"));
            console.log("daily dose:", localStorage.getItem("daily_dose"));

            </script>
    </body>
</html>
