<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOSE CALCULATOR</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg,
        rgba(255,181,192,1) 30%,
        rgba(251,165,251,1) 60%,
        rgba(201,151,237,1) 80%,
        rgba(29,68,82,1) 100%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 10px;
}
.app { width: 100%; max-width: 360px; }
.title {
    width: 100%; min-height: 64px; margin-bottom: 18px;
    border: 2px solid #000; border-radius: 8px;
    background: #9263B5; color: #000;
    font-size: 24px; font-weight: 800;
}
.mode {
    width: 100%; min-height: 52px; margin-bottom: 18px;
    border: 3px solid rgba(11,65,92,.8); border-radius: 6px;
    background: #8AADBC; font-size: 20px; font-weight: 700;
}
.card {
    width: 100%; padding: 18px 16px;
    background: #F3FBFF; border: 1px solid #000;
    border-radius: 20px; box-shadow: 4px 5px 6px 2px #6A767B;
}
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
label { display:block; font-weight:700; margin-bottom:6px; }
input, select {
    width:100%; height:38px; padding:6px 9px;
    border:1px solid #555; border-radius:5px;
    background:#fff; font-size:15px;
}
input:focus, select:focus { outline:2px solid rgba(95,168,218,.5); }
.age-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.hidden { display:none !important; }
.option-group { display:flex; flex-direction:column; gap:7px; }
.option {
    display:flex; align-items:center; gap:8px;
    padding:8px 9px; border:1px solid #b7c3ca;
    border-radius:5px; background:#fff; cursor:pointer;
}
.option input { width:auto; height:auto; margin:0; }
.calculate-wrap { display:flex; justify-content:center; margin:20px 0; }
#calculate {
    width:110px; height:40px; border:1px solid #124d70;
    border-radius:6px; font-weight:700; cursor:pointer;
    background:linear-gradient(180deg,#5FA8DA 0%,#4E97C9 45%,#146CA8 100%);
}
.message {
    padding:10px 12px; border-radius:7px; margin-top:10px;
    background:rgba(255,255,255,.9); border:1px solid #888;
}
.error { color:#8a1f1f; border-color:#a33; }
</style>
</head>
<body>
<main class="app">
    <button class="title" type="button">DOSE-CALCULATOR</button>
    <button class="mode" type="button">Weight Based Calculation</button>

    <section class="card">
        <div class="field">
            <label for="drug">Drug</label>
            <input id="drug" type="text" list="drugList" placeholder="Select Drug" autocomplete="off">
            <datalist id="drugList"></datalist>
        </div>

        <div id="indicationField" class="field hidden">
            <label>Indication</label>
            <div id="indicationOptions" class="option-group"></div>
        </div>

        <div id="ageRuleField" class="field hidden">
            <label>Age-specific dose</label>
            <div id="ageRuleOptions" class="option-group"></div>
        </div>

        <div class="field">
            <label for="dosageForm">Dosage Form</label>
            <select id="dosageForm">
                <option value="">Select Dosage Form</option>
            </select>
        </div>

        <div id="strengthField" class="field hidden">
            <label>Strength</label>
            <div id="strengthOptions" class="option-group"></div>
        </div>

        <div class="field">
            <label for="weight">Weight (kg)</label>
            <input id="weight" type="number" min="0" step="0.01" placeholder="Enter weight">
        </div>

        <div class="field">
            <label>Age</label>
            <div class="age-row">
                <input id="years" type="number" min="0" step="1" placeholder="Years">
                <input id="months" type="number" min="0" max="11" step="1" placeholder="Months">
            </div>
        </div>
    </section>

    <div class="calculate-wrap">
        <button id="calculate" type="button">Calculate</button>
    </div>
    <div id="message"></div>
</main>

/*
  UNIVERSAL DOSAGE FORM LIST
  --------------------------
  These choices are available for every drug, regardless of whether
  its dose is simple, age-specific, indication-specific, or formulation-specific.

  The drug's `formulation` data is used for concentration/strength
  selection when the user chooses a liquid dosage form.
*/
const dosageforms = [
    { dosageform: "Tablet" },
    { dosageform: "Capsule" },
    { dosageform: "Suspension" },
    { dosageform: "Powd. for Suspension" },
    { dosageform: "Syrup" },
    { dosageform: "Drops" },
    { dosageform: "Injection" }
];

const drugInput = document.getElementById("drug");
const dosageFormInput = document.getElementById("dosageForm");
const indicationField = document.getElementById("indicationField");
const indicationOptions = document.getElementById("indicationOptions");
const ageRuleField = document.getElementById("ageRuleField");
const ageRuleOptions = document.getElementById("ageRuleOptions");
const strengthField = document.getElementById("strengthField");
const strengthOptions = document.getElementById("strengthOptions");
const message = document.getElementById("message");
const liquidForms = ["Syrup", "Suspension", "Powd. for Suspension"];

function clean(value) {
    return String(value ?? "").trim().toLowerCase();
}

function getDrug() {
    return standarddose.find(d => clean(d.drug) === clean(drugInput.value));
}

function isLiquid(form) {
    return liquidForms.includes(form);
}

function formulations(drug) {
    return Array.isArray(drug?.formulation) ? drug.formulation : [];
}

function getIndicationList(drug) {
    if (Array.isArray(drug?.indications)) return drug.indications;
    if (Array.isArray(drug?.indication)) return drug.indication;
    return [];
}

function getIndicationLabel(item) {
    if (!item) return "";
    if (typeof item === "string") return item;
    return item.name || item.indication || item.indication1 || item.indication2 || item.indication3 || "";
}

function getAgeRules(drug) {
    const indication = selectedIndication(drug);

    // Nested structure: Drug -> Indication -> Age rule
    if (Array.isArray(indication?.age)) return indication.age;

    // Older/simple structure: Drug -> Age rule
    if (Array.isArray(drug?.age)) return drug.age;

    return [];
}

function getDoseUnit(doseType) {
    return doseType === "weight" ? "mg/kg" : "mg";
}

function showError(text) {
    message.innerHTML = `<div class="message error">${escapeHtml(text)}</div>`;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;")
        .replaceAll(">","&gt;").replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function referenceText(reference) {
    if (!reference || reference === "NA") return null;
    if (typeof reference === "string") {
        return { source: reference, edition: "", author: "", urls: [] };
    }
    return {
        source: reference.source || "",
        edition: reference.edition || "",
        author: reference.author || "",
        urls: Array.isArray(reference.urls) ? reference.urls : []
    };
}

function renderDrugList() {
    document.getElementById("drugList").innerHTML =
        standarddose.map(d => `<option value="${escapeHtml(d.drug)}"></option>`).join("");
}

function renderIndications(drug) {
    indicationOptions.innerHTML = "";
    indicationField.classList.add("hidden");

    const indications = getIndicationList(drug);
    if (!indications.length) return;

    // A single plain-string indication is information, not a selection.
    if (indications.length === 1 && typeof indications[0] === "string") return;

    indicationField.classList.remove("hidden");
    indicationOptions.innerHTML = indications.map((item, i) => `
        <label class="option">
            <input type="radio" name="indication" value="${i}">
            <span>${escapeHtml(getIndicationLabel(item))}</span>
        </label>
    `).join("");
}

function renderAgeRules(drug) {
    ageRuleOptions.innerHTML = "";
    ageRuleField.classList.add("hidden");

    const rules = getAgeRules(drug);
    if (!rules.length) return;

    ageRuleField.classList.remove("hidden");
    ageRuleOptions.innerHTML = rules.map((item, i) => {
        const label = item.range || item.age || item.label || item.age1 || item.age2 || item.age3 || "Dose option";
        return `
            <label class="option">
                <input type="radio" name="ageRule" value="${i}">
                <span>${escapeHtml(label)}</span>
            </label>
        `;
    }).join("");
}

function renderForms(drug) {
    dosageFormInput.innerHTML = `<option value="">Select Dosage Form</option>`;
    strengthField.classList.add("hidden");
    strengthOptions.innerHTML = "";

    if (!drug) return;

    dosageforms.forEach(item => {
        const option = document.createElement("option");
        option.value = item.dosageform;
        option.textContent = item.dosageform;
        dosageFormInput.appendChild(option);
    });
}

function renderStrengths(drug, form) {
    strengthOptions.innerHTML = "";
    strengthField.classList.add("hidden");

    if (!drug || !isLiquid(form)) return;

    const strengths = formulations(drug).filter(f =>
        clean(f.type) === clean(form) && f.mg != null && f.ml != null
    );

    if (!strengths.length) {
        strengthField.classList.remove("hidden");
        strengthOptions.innerHTML = `
            <div class="message error">
                No strength/concentration data has been entered for
                <strong>${escapeHtml(form)}</strong> for this drug.
            </div>
        `;
        return;
    }

    strengthField.classList.remove("hidden");
    strengthOptions.innerHTML = strengths.map((f, i) => `
        <label class="option">
            <input type="radio" name="strength" value="${i}">
            <span>${escapeHtml(f.mg)} mg / ${escapeHtml(f.ml)} mL</span>
        </label>
    `).join("");
}

function selectedIndication(drug) {
    const indications = getIndicationList(drug);
    if (!indications.length) return null;

    if (indications.length === 1 && typeof indications[0] === "string") {
        return { name: indications[0] };
    }

    const input = document.querySelector('input[name="indication"]:checked');
    return input ? indications[Number(input.value)] : null;
}

function parseAgeRange(rule) {
    const text = String(rule?.range || "").toLowerCase();
    const nums = text.match(/\d+(?:\.\d+)?/g)?.map(Number) || [];

    if (rule?.ageMinMonths != null || rule?.ageMaxMonths != null) {
        return {
            min: rule.ageMinMonths ?? 0,
            max: rule.ageMaxMonths ?? Infinity
        };
    }

    // A rule with only weight conditions is matched by weight, not age.
    if (!text.includes("year") && !text.includes("month")) return null;
    if (!nums.length) return null;

    if (text.includes("<")) {
        const max = nums[0] * (text.includes("month") ? 1 : 12);
        return { min: 0, max: max - 0.01 };
    }

    if (text.includes(">") || text.includes("above") || text.includes("older")) {
        const min = nums[0] * (text.includes("month") ? 1 : 12);
        return { min: min, max: Infinity };
    }

    if (nums.length >= 2) {
        const firstIsMonth = text.indexOf("month") !== -1 &&
            text.indexOf("month") < text.indexOf("-");
        const secondIsMonth = text.lastIndexOf("month") > text.indexOf("-");
        return {
            min: firstIsMonth ? nums[0] : nums[0] * 12,
            max: secondIsMonth ? nums[1] : nums[1] * 12
        };
    }

    return null;
}

function ruleMatchesAgeAndWeight(rule) {
    const years = Number(document.getElementById("years").value || 0);
    const months = Number(document.getElementById("months").value || 0);
    const weight = Number(document.getElementById("weight").value || 0);

    if (years < 0 || months < 0 || months > 11) return false;

    const totalMonths = years * 12 + months;
    const ageRange = parseAgeRange(rule);

    if (ageRange && (totalMonths < ageRange.min || totalMonths > ageRange.max)) return false;
    if (rule?.minWeight != null && weight < Number(rule.minWeight)) return false;
    if (rule?.maxWeight != null && weight > Number(rule.maxWeight)) return false;

    return Boolean(ageRange || rule?.minWeight != null || rule?.maxWeight != null);
}

function selectedAgeRule(drug) {
    const rules = getAgeRules(drug);
    if (!rules.length) return null;

    const chosen = document.querySelector('input[name="ageRule"]:checked');
    if (chosen) return rules[Number(chosen.value)];

    return rules.find(ruleMatchesAgeAndWeight) || null;
}

function selectedStrength(drug, form) {
    if (!isLiquid(form)) return null;
    const input = document.querySelector('input[name="strength"]:checked');
    if (!input) return null;

    return formulations(drug)
        .filter(f => clean(f.type) === clean(form) && f.mg != null && f.ml != null)
        [Number(input.value)] || null;
}

function getDose(drug) {
    const indication = selectedIndication(drug);

    // Drug -> Indication -> Age
    if (Array.isArray(indication?.age)) {
        const item = selectedAgeRule(drug);
        if (!item) return { error: "Please select an age-specific dose." };
        if (item.doseType === "not_established") {
            return { error: "Safety and efficacy are not established for this age group." };
        }
        return {
            dose: Number(item.dose),
            frequency: item.frequency || indication.frequency || drug.frequency || "NA",
            doseType: item.doseType || indication.doseType || drug.doseType || "weight",
            duration: item.duration || indication.duration || "",
            maxPerDose: item.max_per_dose ?? indication.max_per_dose ?? null,
            ageRule: item
        };
    }

    // Drug -> Indication
    if (indication && typeof indication === "object") {
        if (indication.dose != null && indication.dose !== "NA") {
            return {
                dose: Number(indication.dose),
                frequency: indication.frequency || drug.frequency || "NA",
                doseType: indication.doseType || drug.doseType || "weight",
                duration: indication.duration || "",
                maxPerDose: indication.max_per_dose ?? null
            };
        }
    }

    // Drug -> Age
    if (Array.isArray(drug.age)) {
        const item = selectedAgeRule(drug);
        if (!item) return { error: "Please enter/select a valid age group." };
        if (item.doseType === "not_established") {
            return { error: "Safety and efficacy are not established for this age group." };
        }
        return {
            dose: Number(item.dose),
            frequency: item.frequency || drug.frequency || "NA",
            doseType: item.doseType || drug.doseType || "weight",
            duration: item.duration || "",
            maxPerDose: item.max_per_dose ?? null,
            ageRule: item
        };
    }

    // Drug -> simple dose
    if (drug.dose != null && drug.dose !== "NA") {
        return {
            dose: Number(drug.dose),
            frequency: drug.frequency || "NA",
            doseType: drug.doseType || "weight",
            duration: drug.duration || "",
            maxPerDose: drug.max_per_dose ?? null
        };
    }

    return { error: "Dose information is not available for this drug." };
}

function saveResult(data) {
    localStorage.setItem("doseCalculatorResult", JSON.stringify(data));

    // Keep the older keys for compatibility with your existing pages/code.
    localStorage.setItem("selecteddrug", JSON.stringify(data.drug));
    localStorage.setItem("drug", data.drug);
    localStorage.setItem("dose", data.dose);
    localStorage.setItem("weight", data.weight);
    localStorage.setItem("daily_dose", data.dailyDoseMg ?? "");
    localStorage.setItem("frequency", data.frequency);
    localStorage.setItem("max_dose", data.maxDose);
    localStorage.setItem("additional_Note", JSON.stringify(data.additionalNote));
    localStorage.setItem("dosageform", data.dosageForm);
    localStorage.setItem("selecteddosageform", data.dosageForm);
    localStorage.setItem("selectedsyrupstrength", data.selectedStrength
        ? `${data.selectedStrength.mg}/${data.selectedStrength.ml}` : "");
    localStorage.setItem("mg", data.selectedStrength?.mg ?? "");
    localStorage.setItem("ml", data.selectedStrength?.ml ?? "");
    localStorage.setItem("syrupdose", data.dailyDoseMl ?? "");
    localStorage.setItem("syrup_strength", JSON.stringify(data.formulations));
    localStorage.setItem("indication", data.indication);
}

function calculate() {
    message.innerHTML = "";

    const drug = getDrug();
    if (!drug) return showError("Please select a valid drug.");

    const weight = Number(document.getElementById("weight").value);
    if (!Number.isFinite(weight) || weight <= 0)
        return showError("Please enter a valid weight.");

    const dosageForm = dosageFormInput.value;
    if (!dosageForm) return showError("Please select a dosage form.");

    const doseInfo = getDose(drug);
    if (doseInfo.error) return showError(doseInfo.error);

    const strength = selectedStrength(drug, dosageForm);
    if (isLiquid(dosageForm) && !strength)
        return showError("Please select a strength.");

    // Weight-based: dose is multiplied by weight.
    // Fixed: dose is already the final mg amount for the selected age.
    const doseAmountMg = doseInfo.doseType === "fixed"
        ? doseInfo.dose
        : weight * doseInfo.dose;

    const dailyDoseMg = doseAmountMg;
    const dailyDoseMl = strength
        ? (dailyDoseMg * Number(strength.ml)) / Number(strength.mg)
        : null;

    const indication = selectedIndication(drug);
    const ageRule = doseInfo.ageRule || selectedAgeRule(drug);
    const reference = referenceText(drug.reference);
    const notes = Array.isArray(drug.additional_Note)
        ? drug.additional_Note
        : String(drug.additional_Note || "NA")
            .split(/\n+/)
            .map(note => note.trim())
            .filter(Boolean);

    const data = {
        drug: drug.drug,
        weight,
        dosageForm,
        dose: doseInfo.dose,
        doseType: doseInfo.doseType,
        doseAmountMg,
        dailyDoseMg,
        dailyDoseMl,
        doseUnit: getDoseUnit(doseInfo.doseType),
        frequency: doseInfo.frequency || "NA",
        duration: doseInfo.duration || "",
        maxDose: drug.max_dose || "NA",
        maxPerDose: doseInfo.maxPerDose,
        additionalNote: notes,
        reference,
        indication: getIndicationLabel(indication),
        ageRule: ageRule?.range || ageRule?.age || ageRule?.label || "",
        selectedStrength: strength,
        formulations: formulations(drug)
    };

    saveResult(data);

    // Result is displayed by output.html.
    window.location.href = "output.html";
}

drugInput.addEventListener("change", () => {
    const drug = getDrug();
    renderIndications(drug);
    renderAgeRules(drug);
    renderForms(drug);
    message.innerHTML = "";
});

indicationOptions.addEventListener("change", () => {
    renderAgeRules(getDrug());
    message.innerHTML = "";
});

dosageFormInput.addEventListener("change", () => {
    renderStrengths(getDrug(), dosageFormInput.value);
    message.innerHTML = "";
});

document.getElementById("calculate").addEventListener("click", calculate);

renderDrugList();
</script>
